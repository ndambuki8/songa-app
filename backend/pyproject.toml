[project]
name = "songa-backend"
version = "1.0.0"
description = "Serverless gateway for Songa on Modal: Muse Wonder, SAM 3.1 and Muse Voice Transcribe via the Meta Model API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "httpx>=0.27",
  "pillow>=10.4",
  "numpy>=1.26",
  "meta-sam-parser>=0.0.6",
]

[project.optional-dependencies]
deploy = ["modal>=1.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
